name: SPSE shareable audit privacy check
on:
  push:
    paths:
      - 'v2.2/**'
      - 'tests/Test-ShareableAudit.ps1'
      - 'tests/Test-SPAuditScheduler.ps1'
      - 'tests/Test-SPSESqlMerge.ps1'
      - 'tests/Test-SPSESqlBuilder.ps1'
      - 'tests/Test-SPSESqlMerge_v2_3_1.ps1'
      - 'tests/Test-SPWorkflowDiagnostic.ps1'
      - 'v2.3/**'
      - 'v2.3.1/**'
      - 'v2.4/**'
      - '.github/workflows/shareable-audit.yml'
  pull_request:
    paths:
      - 'v2.2/**'
      - 'tests/Test-ShareableAudit.ps1'
      - 'tests/Test-SPAuditScheduler.ps1'
      - 'tests/Test-SPSESqlMerge.ps1'
      - 'tests/Test-SPSESqlBuilder.ps1'
      - 'tests/Test-SPSESqlMerge_v2_3_1.ps1'
      - 'tests/Test-SPWorkflowDiagnostic.ps1'
      - 'v2.3/**'
      - 'v2.3.1/**'
      - 'v2.4/**'
      - '.github/workflows/shareable-audit.yml'
jobs:
  privacy-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 parser and scheduled-task checks
        shell: powershell
        run: .\tests\Test-SPAuditScheduler.ps1
      - name: PowerShell 5.1 SQL connection builder regression test
        shell: powershell
        run: .\tests\Test-SPSESqlBuilder.ps1
      - name: PowerShell 5.1 workflow diagnostic parser and read-only guard
        shell: powershell
        run: .\tests\Test-SPWorkflowDiagnostic.ps1
      - name: PowerShell 5.1 standalone v2.3.1 regression test
        shell: powershell
        run: .\tests\Test-SPSESqlMerge_v2_3_1.ps1
      - name: PowerShell 5.1 SQL merge and report regression test
        shell: powershell
        run: .\tests\Test-SPSESqlMerge.ps1
      - name: PowerShell 5.1 privacy regression test
        shell: powershell
        run: .\tests\Test-ShareableAudit.ps1
