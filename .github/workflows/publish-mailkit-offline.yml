name: Publish MailKit offline ZIP to repository root

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-mailkit-offline.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-mailkit-offline-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build verified MailKit dependencies locally
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root='Exchange/ForwardingAudit'
          & (Join-Path $root 'Install-MailKit.ps1')
          $lib=Join-Path $root 'Dependencies/MailKit/lib'
          $expected=@(
            'MailKit.dll','MimeKit.dll','BouncyCastle.Cryptography.dll',
            'System.Buffers.dll','System.Memory.dll','System.Formats.Asn1.dll',
            'System.Numerics.Vectors.dll','System.Threading.Tasks.Extensions.dll',
            'System.Runtime.CompilerServices.Unsafe.dll','manifest.json'
          )
          foreach($name in $expected){
            if(-not (Test-Path -LiteralPath (Join-Path $lib $name) -PathType Leaf)){
              throw "Missing MailKit dependency: $name"
            }
          }
          Write-Host 'PASS: all nine pinned DLLs and manifest.json'
      - name: Create ZIP in repository root
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip=Join-Path (Get-Location) 'MailKit-offline-WinPS51.zip'
          $source=Join-Path 'Exchange/ForwardingAudit/Dependencies' 'MailKit'
          Compress-Archive -LiteralPath $source -DestinationPath $zip -CompressionLevel Optimal -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive=[IO.Compression.ZipFile]::OpenRead($zip)
          try{
            $names=@($archive.Entries | ForEach-Object FullName)
            foreach($entry in @('MailKit/lib/MailKit.dll','MailKit/lib/MimeKit.dll','MailKit/lib/manifest.json')){
              if($names -notcontains $entry){throw "ZIP missing expected entry: $entry"}
            }
          }finally{$archive.Dispose()}
          Write-Host "PASS: ZIP = $zip ($((Get-Item -LiteralPath $zip).Length) bytes)"
      - name: Commit ZIP directly to main
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- MailKit-offline-WinPS51.zip
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){
            Write-Host 'MailKit ZIP already tracked and unchanged.'
            exit 0
          }
          if($LASTEXITCODE -ne 1){throw 'Unable to inspect staged ZIP changes.'}
          git commit -m "Add offline MailKit ZIP for Windows PowerShell 5.1"
          if($LASTEXITCODE -ne 0){throw 'git commit failed'}
          git push origin HEAD:refs/heads/main
          if($LASTEXITCODE -ne 0){throw 'git push failed; check Actions contents:write and branch protection'}
